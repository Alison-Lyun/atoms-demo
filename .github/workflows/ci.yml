name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the browser fixture checks (currently under repair)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      PLAYWRIGHT_CHANNEL: chrome
      ENABLE_DEV_FIXTURES: 'true'
      STORAGE_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Install browser
        run: npx playwright install --with-deps chrome
      - name: Browser fixture tests
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: ../../work/playwright-results
          if-no-files-found: ignore
          retention-days: 7
